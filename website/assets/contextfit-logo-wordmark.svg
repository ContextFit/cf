<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 112" role="img" aria-labelledby="title desc">
  <title id="title">ContextFit logo</title>
  <desc id="desc">A bracketed context window with three left-aligned token rows forming an abstract F beside the ContextFit wordmark.</desc>
  <defs>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g>
    <path d="M39 31H29c-6 0-11 5-11 11v28c0 6 5 11 11 11h10"
          fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="square" stroke-linejoin="round"/>
    <path d="M73 31h10c6 0 11 5 11 11v28c0 6-5 11-11 11H73"
          fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="square" stroke-linejoin="round"/>
    <rect x="42" y="37" width="36" height="7" rx="3.5" fill="#7f8a9c" opacity=".74"/>
    <rect x="42" y="53" width="31" height="7" rx="3.5" fill="#38d7fb" filter="url(#soft-glow)"/>
    <rect x="42" y="69" width="14" height="7" rx="3.5" fill="#7f8a9c" opacity=".74"/>
  </g>

  <text x="128" y="72"
        fill="#f8fafc"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="52"
        font-weight="800"
        letter-spacing="-2">ContextFit</text>
</svg>
