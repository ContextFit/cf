[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextfit"
version = "0.1.1"
description = "Token-native knowledge base for LLM scale"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ContextFit" }
]
keywords = ["llm", "rag", "knowledge-base", "tokens", "graph"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "tiktoken>=0.5.0",
    "pyroaring>=0.4.0",
    "zstandard>=0.21.0",
    "numpy>=1.24.0",
    "datasketch>=1.6.0",
    "networkx>=3.0",
    "tqdm>=4.65.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
rust = [
    # Rust extensions when ready
]

[project.scripts]
contextfit = "contextfit.cli:main"

[project.urls]
Homepage = "https://github.com/ContextFit/cf"
Documentation = "https://github.com/ContextFit/cf#readme"
Repository = "https://github.com/ContextFit/cf"

[tool.hatch.build.targets.wheel]
packages = ["src/contextfit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
